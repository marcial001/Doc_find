name: Admin Dashboard CI

on:
  push:
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin.yml'
  pull_request:
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin.yml'

jobs:
  test:
    name: Lint, Test & Build Admin Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type-Check (vue-tsc)
        run: npm run type-check

      - name: Run Unit & Component Tests with Coverage
        run: npm run test:coverage

      - name: Build Production Distribution
        run: npm run build
